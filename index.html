<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>AI Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#172033}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#111827;color:#fff;padding:18px;display:flex;flex-direction:column}
.brand{font-size:21px;font-weight:800;margin:5px 4px 22px}
.new{background:#6d5dfc;color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px}
.title{font-size:11px;color:#9ca3af;margin:25px 5px 10px;text-transform:uppercase;letter-spacing:1px}
.chatitem{padding:10px;border-radius:9px;color:#d1d5db;margin-bottom:4px}
.bottom{margin-top:auto}.bottom button{width:100%;padding:11px;margin-top:6px;border:0;background:#1f2937;color:#e5e7eb;border-radius:9px;text-align:left}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:19px;margin:0 0 5px}.online{font-size:12px;color:#667085}.dot{display:inline-block;width:7px;height:7px;background:#22c55e;border-radius:50%;margin-right:5px}
.clear{border:0;background:#f1f2f6;border-radius:9px;padding:9px 12px}
.chat{flex:1;overflow:auto;padding:25px 7%}
.welcome{text-align:center;max-width:680px;margin:35px auto}
.logo{width:58px;height:58px;border-radius:18px;background:#6d5dfc;color:white;display:grid;place-items:center;margin:auto;font-size:28px}
.welcome h2{font-size:30px;margin:17px 0 7px}.welcome p{color:#667085;line-height:1.5}
.suggest{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.suggest button,.tools button{border:1px solid #dfe3ea;background:#fff;border-radius:11px;padding:12px;cursor:pointer}
.message{display:flex;gap:9px;margin:14px 0}.avatar{width:34px;height:34px;border-radius:10px;background:#6d5dfc;color:white;display:grid;place-items:center;flex:none}
.bubble{background:#fff;border:1px solid #e2e5ec;border-radius:14px;padding:11px 14px;max-width:78%;line-height:1.5}
.message.user{justify-content:flex-end}.message.user .bubble{background:#6d5dfc;color:#fff;border:0}
.tools{display:flex;gap:8px;padding:0 7%;align-items:center}.tools button{padding:8px 11px}
#fileStatus{font-size:12px;color:#667085}
.composer{margin:10px 7% 7px;background:#fff;border:1px solid #dfe3ea;border-radius:15px;padding:7px;display:flex;gap:7px}
.composer input{flex:1;border:0;outline:0;padding:10px;font-size:15px}
.icon{width:42px;border:0;border-radius:10px;background:#f1f2f6}.send{background:#6d5dfc;color:#fff}
.note{text-align:center;color:#98a0ad;font-size:11px;margin:0 0 10px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.modal.hide{display:none}
.card{background:#fff;width:min(380px,90%);border-radius:18px;padding:24px;position:relative}.close{position:absolute;right:14px;top:9px;border:0;background:none;font-size:24px}
.card label{display:block;padding:11px 0}.done{width:100%;padding:11px;border:0;border-radius:10px;background:#6d5dfc;color:#fff}
@media(max-width:700px){.sidebar{display:none}.top{padding:15px}.chat{padding:20px 5%}.tools,.composer{margin-left:5%;margin-right:5%}.suggest{grid-template-columns:1fr}.welcome{margin-top:25px}.welcome h2{font-size:27px}.bubble{max-width:88%}}
.dark{background:#0b1220;color:#e5e7eb}.dark .top,.dark .bubble,.dark .suggest button,.dark .tools button,.dark .composer,.dark .card{background:#111827;color:#e5e7eb;border-color:#263244}.dark .welcome p,.dark .online,#fileStatus{color:#9ca3af}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">✦ AI Assistant</div>
<button class="new" onclick="newChat()">＋ New Chat</button>
<div class="title">Recent Chats</div><div id="history"></div>
<div class="bottom"><button onclick="toggleTheme()">☾ Theme</button><button onclick="settings()">⚙ Settings</button></div>
</aside>
<main class="main">
<header class="top"><div><h1>AI Conversational Assistant</h1><span class="online"><span class="dot"></span>AI Assistant Online</span></div><button class="clear" onclick="clearChat()">⌫</button></header>
<section class="chat" id="chat">
<div class="welcome"><div class="logo">✦</div><h2>How can I help you?</h2><p>Ask a question, study a topic, generate ideas, or get a simple explanation.</p>
<div class="suggest">
<button onclick="prompt('Explain Artificial Intelligence in simple words')">🤖 Explain AI simply</button>
<button onclick="prompt('Give me 5 important DBMS topics for an exam')">📚 Study help</button>
<button onclick="prompt('Translate Hello, how are you? into Tamil')">🌐 Translate</button>
<button onclick="prompt('Give me a simple project idea for a computer science student')">💡 Project ideas</button>
</div></div></section>
<div class="tools"><button onclick="img.click()">📷 Image</button><button onclick="doc.click()">📄 Document</button><input id="img" type="file" accept="image/*" hidden onchange="file(this,'Image')"><input id="doc" type="file" accept=".pdf,.doc,.docx,.txt" hidden onchange="file(this,'Document')"><span id="fileStatus"></span></div>
<form class="composer" onsubmit="send(event)"><button class="icon" type="button" onclick="voice()">🎤</button><input id="msg" placeholder="Message AI Assistant..."><button class="icon send" type="submit">➤</button></form>
<p class="note">Academic project demonstration</p>
</main></div>
<div class="modal hide" id="modal"><div class="card"><button class="close" onclick="closeSettings()">×</button><h2>Settings</h2><label>☑ Save conversation history</label><label>☑ Suggested prompts</label><button class="done" onclick="closeSettings()">Done</button></div></div>
<script>
const chat=document.getElementById('chat'),msg=document.getElementById('msg'),history=document.getElementById('history'),modal=document.getElementById('modal'),fileStatus=document.getElementById('fileStatus'),img=document.getElementById('img'),doc=document.getElementById('doc');
let hs=JSON.parse(localStorage.getItem('ai_history')||'[]');
function prompt(x){msg.value=x;msg.focus()}
function answer(q){q=q.toLowerCase();if(q.includes('artificial intelligence')||q.includes(' ai'))return 'Artificial Intelligence (AI) enables computers to perform tasks that normally require human intelligence, such as understanding language, recognizing patterns, and solving problems.';if(q.includes('dbms'))return 'DBMS stands for Database Management System. It is software used to store, organize, retrieve and manage data efficiently.';if(q.includes('translate')&&q.includes('tamil'))return '“Hello, how are you?” → “வணக்கம், நீங்கள் எப்படி இருக்கிறீர்கள்?”';if(q.includes('project'))return 'A strong project should solve a real problem. An AI conversational assistant can provide educational help, general answers, document assistance and multilingual interaction.';if(q.includes('hello')||q.includes('hi'))return 'Hello! 👋 I’m your AI Conversational Assistant. How can I help you today?';return 'I understand your question. This academic demo is ready for AI-model integration through a secure backend.'}
function add(t,u){let r=document.createElement('div');r.className='message '+(u?'user':'');let a=document.createElement('div');a.className='avatar';a.textContent=u?'U':'✦';let b=document.createElement('div');b.className='bubble';b.textContent=t;r.append(u?b:a,u?a:b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r}
function send(e){e.preventDefault();let q=msg.value.trim();if(!q)return;document.querySelector('.welcome')?.remove();add(q,true);msg.value='';let t=add('Thinking…');setTimeout(()=>{t.remove();add(answer(q));hs.unshift(q);hs=hs.slice(0,8);localStorage.setItem('ai_history',JSON.stringify(hs));render()},450)}
function render(){history.innerHTML=hs.map(x=>'<div class="chatitem">'+x.replace(/[&<>]/g,'')+'</div>').join('')}function newChat(){location.reload()}function clearChat(){chat.innerHTML='<div class="welcome"><div class="logo">✦</div><h2>How can I help you?</h2><p>Start a new conversation with your AI assistant.</p></div>'}function toggleTheme(){document.body.classList.toggle('dark')}function settings(){modal.classList.remove('hide')}function closeSettings(){modal.classList.add('hide')}function file(x,t){if(x.files[0])fileStatus.textContent=' '+t+': '+x.files[0].name}function voice(){if(!('webkitSpeechRecognition'in window)){alert('Voice input needs Google Chrome.');return}let r=new webkitSpeechRecognition();r.lang='en-IN';r.onresult=e=>msg.value=e.results[0][0].transcript;r.start()}render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body></html>
